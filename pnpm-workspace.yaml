packages:
  - apps/*
  - packages/*

autoInstallPeers: false
strictPeerDependencies: false

minimumReleaseAge: 1440

# CI installs the manifest pin; keep the lockfile compatible with GitHub dependency updates.
pmOnFail: ignore

allowBuilds:
  "@astryxdesign/cli": false
  "@astryxdesign/core": false
  esbuild: false
  workerd: false

autoDedupe: true
lockfile:
  includeResolutionSettings: true
