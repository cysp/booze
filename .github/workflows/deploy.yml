name: deploy

on:
  workflow_run:
    workflows:
      - ci
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  cloudflare-deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: production

    env:
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Check browser authentication configuration
        run: |
          if [[ -z "${VITE_CLERK_PUBLISHABLE_KEY//[[:space:]]/}" ]]; then
            echo "::error::Set VITE_CLERK_PUBLISHABLE_KEY in the production environment before deploying."
            exit 1
          fi

      - name: Build Worker and browser assets
        run: pnpm --filter @chikachow/booze-web run build

      - name: Apply D1 migrations
        run: pnpm --filter @chikachow/booze-web exec wrangler d1 migrations apply booze --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_WRITE_LOGS: "false"

      - name: Deploy Worker
        run: pnpm --filter @chikachow/booze-web exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_WRITE_LOGS: "false"

      - name: Probe deployment
        run: curl --fail --silent --show-error https://booze.chikachow.workers.dev/healthz
