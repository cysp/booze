name: build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Build without browser authentication configuration
        run: pnpm --filter @chikachow/booze-web run build

      - name: Build with browser authentication configuration
        run: pnpm --filter @chikachow/booze-web run build
        env:
          # Public test fixture: exercise the configured build without deployment secrets.
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_YnVuZGxlLWJ1ZGdldC1jaS5jbGVyay5hY2NvdW50cy5kZXYk
